<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Interaktyvūs e. mokymai su TALENTATOR – mokymų valdymo sistema">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F8FE"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FA3E0"/>
      <stop offset="1" stop-color="#6DD3FF"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F5B7D"/>
      <stop offset="1" stop-color="#3C7099"/>
    </linearGradient>
    <linearGradient id="shieldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA3E0"/>
      <stop offset="1" stop-color="#2F5B7D"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0F2740" flood-opacity="0.20"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F2740" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- connecting network dots (subtle backdrop) -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round">
    <path d="M180 250 C 330 160, 520 150, 690 210"/>
    <path d="M150 560 C 120 400, 180 300, 300 250"/>
    <path d="M820 300 C 900 430, 880 600, 760 700"/>
    <path d="M250 760 C 420 850, 620 850, 790 760"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.7">
    <circle cx="180" cy="250" r="7"/>
    <circle cx="690" cy="210" r="7"/>
    <circle cx="150" cy="560" r="7"/>
    <circle cx="820" cy="300" r="7"/>
    <circle cx="760" cy="700" r="7"/>
    <circle cx="250" cy="760" r="7"/>
    <circle cx="790" cy="760" r="7"/>
  </g>

  <!-- main dashboard card -->
  <g filter="url(#soft)">
    <rect x="185" y="250" width="630" height="470" rx="28" fill="url(#scr)"/>
  </g>
  <!-- top bar -->
  <rect x="185" y="250" width="630" height="62" rx="28" fill="#EAF2FB"/>
  <rect x="185" y="290" width="630" height="22" fill="#EAF2FB"/>
  <circle cx="222" cy="281" r="7" fill="#C81E6A"/>
  <circle cx="248" cy="281" r="7" fill="#6DD3FF"/>
  <circle cx="274" cy="281" r="7" fill="#9DB2C6"/>
  <rect x="600" y="271" width="180" height="20" rx="10" fill="#FFFFFF"/>
  <rect x="620" y="277" width="120" height="8" rx="4" fill="#C6D6E7"/>

  <!-- video lesson block -->
  <rect x="215" y="342" width="270" height="180" rx="16" fill="url(#video)"/>
  <circle cx="350" cy="432" r="38" fill="#FFFFFF" fill-opacity="0.95"/>
  <path d="M338 414 L 372 432 L 338 450 Z" fill="#2F5B7D"/>
  <rect x="235" y="486" width="150" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="235" y="502" width="90" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- lesson list on the right -->
  <g>
    <!-- item 1 done -->
    <rect x="515" y="346" width="270" height="46" rx="12" fill="#FFFFFF"/>
    <rect x="515" y="346" width="270" height="46" rx="12" fill="#EDF6FF" fill-opacity="0.6"/>
    <circle cx="540" cy="369" r="13" fill="#2FBF71"/>
    <path d="M534 369 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="565" y="360" width="150" height="8" rx="4" fill="#3C7099"/>
    <rect x="565" y="374" width="100" height="7" rx="3.5" fill="#C6D6E7"/>

    <!-- item 2 done -->
    <rect x="515" y="402" width="270" height="46" rx="12" fill="#FFFFFF"/>
    <circle cx="540" cy="425" r="13" fill="#2FBF71"/>
    <path d="M534 425 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="565" y="416" width="170" height="8" rx="4" fill="#3C7099"/>
    <rect x="565" y="430" width="90" height="7" rx="3.5" fill="#C6D6E7"/>

    <!-- item 3 active -->
    <rect x="515" y="458" width="270" height="46" rx="12" fill="#FFFFFF"/>
    <rect x="513" y="456" width="274" height="50" rx="14" fill="none" stroke="#4FA3E0" stroke-width="2"/>
    <circle cx="540" cy="481" r="13" fill="#EAF2FB" stroke="#4FA3E0" stroke-width="2"/>
    <circle cx="540" cy="481" r="5" fill="#4FA3E0"/>
    <rect x="565" y="472" width="140" height="8" rx="4" fill="#3C7099"/>
    <rect x="565" y="486" width="110" height="7" rx="3.5" fill="#C6D6E7"/>
  </g>

  <!-- progress bar -->
  <rect x="215" y="548" width="570" height="16" rx="8" fill="#E2ECF7"/>
  <rect x="215" y="548" width="390" height="16" rx="8" fill="url(#bar)"/>
  <rect x="215" y="584" width="120" height="9" rx="4.5" fill="#C6D6E7"/>
  <text x="785" y="542" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#3C7099">68%</text>

  <!-- SCORM tag + completed pill -->
  <rect x="215" y="626" width="118" height="46" rx="23" fill="#EAF2FB"/>
  <text x="274" y="655" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1" fill="#2F5B7D">SCORM</text>

  <rect x="349" y="626" width="210" height="46" rx="23" fill="#E6F8EF"/>
  <circle cx="378" cy="649" r="12" fill="#2FBF71"/>
  <path d="M372 649 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="400" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F8B54">Testas išlaikytas</text>

  <!-- floating shield (compliance) top-left -->
  <g filter="url(#soft2)">
    <path d="M170 300 L 230 320 L 230 372 C 230 408, 202 430, 170 442 C 138 430, 110 408, 110 372 L 110 320 Z" fill="url(#shieldg)"/>
  </g>
  <path d="M148 368 l16 16 l28 -30" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- floating certificate badge bottom-right -->
  <g filter="url(#soft2)">
    <rect x="700" y="580" width="150" height="118" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="722" y="606" width="106" height="9" rx="4.5" fill="#C6D6E7"/>
  <rect x="722" y="626" width="80" height="9" rx="4.5" fill="#DCE7F2"/>
  <rect x="722" y="646" width="96" height="9" rx="4.5" fill="#DCE7F2"/>
  <g filter="url(#soft2)">
    <circle cx="820" cy="690" r="34" fill="#C81E6A"/>
  </g>
  <path d="M806 686 l9 9 l16 -18" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M804 712 l-6 34 l22 -14 l22 14 l-6 -34 Z" fill="#C81E6A"/>

  <!-- floating graduation cap top area -->
  <g filter="url(#soft2)" transform="translate(690 210) rotate(-8)">
    <path d="M0 0 L 70 22 L 0 44 L -70 22 Z" fill="#2F5B7D"/>
    <path d="M0 44 L 40 32 L 40 60 C 40 74, 12 82, 0 82 C -12 82, -40 74, -40 60 L -40 32 Z" fill="#3C7099"/>
    <rect x="66" y="20" width="4" height="40" rx="2" fill="#2F5B7D"/>
    <circle cx="68" cy="64" r="7" fill="#C81E6A"/>
  </g>
</svg>
